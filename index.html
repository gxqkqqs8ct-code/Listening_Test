        .btn-blue { background-color: #74b9ff; }
        .btn-blue:hover { background-color: #0984e3; }
        .btn:disabled { background-color: #dfe6e9; cursor: not-allowed; transform: none; }
        .option-btn { display: block; width: 100%; margin: 12px 0; background-color: #f1f2f6; color: #2f3542; text-align: left; padding: 15px 20px; border-radius: 12px; font-weight: 500; }
        .option-btn:hover { background-color: #dfe4ea; border-left: 5px solid #ff7675; }
        .story-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        #language-selection, #story-selection, #test-section, #quiz-section, #result-section { display: none; }
        #language-selection { display: block; }
        .status { font-weight: bold; color: #e67e22; margin: 20px 0; min-height: 24px; }
        .progress { font-size: 1rem; color: #a4b0be; margin-bottom: 10px; }
        .control-group { margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container" id="language-selection">
    <h1>小一入學聆聽模擬測試</h1>
    <p>請選擇測試語言：</p>
    <button class="btn" onclick="selectLanguage('zh')">廣東話 (Cantonese)</button>
    <button class="btn" onclick="selectLanguage('en')">English</button>
</div>

<div class="container" id="story-selection">
    <h1 id="selection-title">請選擇故事</h1>
    <div id="story-list" class="story-grid"></div>
    <br>
    <button class="btn btn-blue" onclick="goBack('language')">⬅ 返回語言選擇</button>
</div>

<div class="container" id="test-section">
    <h2 id="story-display-name">準備聆聽</h2>
    <div id="playback-main">
        <button class="btn" id="play-btn" onclick="playStory()">▶ 開始播放故事</button>
    </div>
    <div id="playback-controls" class="control-group">
        <button class="btn btn-blue" id="pause-btn" onclick="togglePause()">⏸ 暫停 (Pause)</button>
        <button class="btn" style="background-color: #fab1a0; color: #d63031;" onclick="stopStory()">⏹ 停止 (Stop)</button>
    </div>
    <p class="status" id="speak-status"></p>
</div>

<div class="container" id="quiz-section">
    <p class="progress" id="question-number"></p>
    <h3 id="question-text" style="line-height: 1.6;"></h3>
    <div id="options-container"></div>
</div>

<div class="container" id="result-section">
    <h2>測試完成</h2>
    <p id="final-score" style="font-size: 1.4rem; font-weight: bold; color: #2ecc71;"></p>
    <button class="btn" onclick="location.reload()">重新開始測試</button>
</div>

<div class="container" id="result-section">
    <h2>測試完成</h2>
    <p id="final-score" style="font-size: 1.4rem; font-weight: bold; color: #2ecc71;"></p>
    
    <div id="record-list" style="margin: 20px 0; max-height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px;"></div>
    
    <button class="btn" onclick="location.reload()">重新開始測試</button>
</div>

                        { q: "What is Kim wearing on her head?", o: ["A cap", "A straw hat", "A headband"], a: 1 },
                        { q: "What did they see on the sand?", o: ["A shell", "A crab", "A jellyfish"], a: 1 },
                        { q: "What did Kim's brother catch?", o: ["A fish", "A bird", "A turtle"], a: 0 },
                        { q: "What will they have for dinner?", o: ["Pizza", "Sandwiches", "Barbecue"], a: 2 }
                    ]
                }

            ],
            advanced: []
        }
    };

    let currentLanguage = '';
    let currentStoryList = [];
    let currentStory = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let isPaused = false;
let userAnswers = []; 

    // 直接跳轉到故事列表
    function selectLanguage(lang) {
        currentLanguage = lang;
        showSection('story-selection');
        renderStoryList();
    }

    // 合併 Basic 和 Advanced 故事顯示
    function renderStoryList() {
        const listContainer = document.getElementById('story-list');
        listContainer.innerHTML = '';
        
        // 合併該語言下所有清單
        currentStoryList = [
            ...stories[currentLanguage].basic,
            ...stories[currentLanguage].advanced
        ];
        
        currentStoryList.forEach((story, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.width = '100%';
            btn.innerText = story.title;
            btn.onclick = () => startTest(index);
            listContainer.appendChild(btn);
        });
    }

    function startTest(index) {
    currentStory = currentStoryList[index];
    currentQuestionIndex = 0;
    score = 0;
    userAnswers = []; // 重置紀錄
    isPaused = false;
    showSection('test-section');
    document.getElementById('story-display-name').innerText = currentStory.title;
    resetPlaybackUI();
}

    function showSection(id) {
        window.speechSynthesis.cancel();
        const sections = ['language-selection', 'story-selection', 'test-section', 'quiz-section', 'result-section'];
        sections.forEach(s => document.getElementById(s).style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function goBack(to) {
        if (to === 'language') showSection('language-selection');
    }

    function resetPlaybackUI() {
        document.getElementById('play-btn').style.display = 'inline-block';
        document.getElementById('playback-controls').style.display = 'none';
        document.getElementById('pause-btn').innerText = "⏸ 暫停 (Pause)";
        document.getElementById('speak-status').innerText = '';
    }

    function getFemaleVoice(langCode) {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.includes(langCode) && (v.name.includes('Female') || v.name.includes('Apple') || v.name.includes('Sinji') || v.name.includes('Tracy'))) || voices.find(v => v.lang.includes(langCode));
    }

    function playStory() {
        const status = document.getElementById('speak-status');
        document.getElementById('play-btn').style.display = 'none';
        document.getElementById('playback-controls').style.display = 'block';
        status.innerText = "老師正在讀故事，請細心聆聽...";

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(currentStory.content);
        const langTag = currentLanguage === 'zh' ? 'zh-HK' : 'en-US';
        utterance.lang = langTag;
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.voice = getFemaleVoice(langTag);

        utterance.onend = () => {
            if (!isPaused && document.getElementById('test-section').style.display === 'block') {
                status.innerText = "播放完畢";
                setTimeout(() => showSection('quiz-section'), 800);
                loadQuestion();
            }
        };

        window.speechSynthesis.speak(utterance);
    }

    function togglePause() {
        const pauseBtn = document.getElementById('pause-btn');
        const status = document.getElementById('speak-status');

        if (!isPaused) {
            window.speechSynthesis.pause();
            isPaused = true;
            pauseBtn.innerText = "▶ 繼續 (Resume)";
            status.innerText = "暫停中...";
        } else {
            window.speechSynthesis.resume();
            isPaused = false;
            pauseBtn.innerText = "⏸ 暫停 (Pause)";
            status.innerText = "老師正在讀故事...";
        }
    }

    function stopStory() {
        window.speechSynthesis.cancel();
        isPaused = false;
        resetPlaybackUI();
        document.getElementById('speak-status').innerText = "已停止播放。";
    }

    function loadQuestion() {
    const qData = currentStory.questions[currentQuestionIndex];
    document.getElementById('question-number').innerText = `問題 ${currentQuestionIndex + 1} / ${currentStory.questions.length}`;
    document.getElementById('question-text').innerText = qData.q;
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    qData.o.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn option-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(index, btn); // 改用 handleAnswer 處理
        container.appendChild(btn);
    });
}

// 新增：處理答案點擊，顯示對錯
function handleAnswer(selectedIndex, clickedBtn) {
    const qData = currentStory.questions[currentQuestionIndex];
    const allBtns = document.querySelectorAll('.option-btn');
    
    // 禁用所有按鈕防止重複點擊
    allBtns.forEach(b => b.style.pointerEvents = 'none');

    const isCorrect = (selectedIndex === qData.a);
    
    // 儲存紀錄
    userAnswers.push({
        question: qData.q,
        options: qData.o,
        selected: selectedIndex,
        correct: qData.a,
        isCorrect: isCorrect
    });

    if (isCorrect) {
        score++;
        clickedBtn.style.backgroundColor = "#55efc4"; // 正確色 (淺綠)
        clickedBtn.innerHTML += " ✅";
    } else {
        clickedBtn.style.backgroundColor = "#ff7675"; // 錯誤色 (淺紅)
        clickedBtn.innerHTML += " ❌";
        // 顯示正確答案
        allBtns[qData.a].style.border = "3px solid #2ecc71";
    }

    // 延遲 1 秒後進入下一題或顯示結果
    setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentStory.questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }, 1200);
}

function showResult() {
    showSection('result-section');
    document.getElementById('final-score').innerText = `最終得分：${score} / ${currentStory.questions.length}`;
    
    const recordContainer = document.getElementById('record-list');
    recordContainer.innerHTML = '<h3>作答紀錄：</h3>';
    
    userAnswers.forEach((item, i) => {
        const div = document.createElement('div');
        div.style.textAlign = 'left';
        div.style.padding = '10px';
        div.style.margin = '10px 0';
        div.style.borderRadius = '8px';
        div.style.backgroundColor = item.isCorrect ? '#f0fff4' : '#fff5f5';
        div.style.borderLeft = item.isCorrect ? '5px solid #2ecc71' : '5px solid #ff7675';
        
        div.innerHTML = `
            <strong>Q${i+1}: ${item.question}</strong><br>
            您的答案: <span style="color:${item.isCorrect ? 'green' : 'red'}">${item.options[item.selected]}</span><br>
            ${item.isCorrect ? '' : `正確答案: <span style="color:green">${item.options[item.correct]}</span>`}
        `;
        recordContainer.appendChild(div);
    });
}
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
</script>
